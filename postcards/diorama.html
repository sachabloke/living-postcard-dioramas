<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postcard Dioramas</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
<style>
  :root { --paper:#f6efe0; --ink:#2b2a22; }
  html, body { margin:0; height:100%; background:#10161a; overflow:hidden; font:14px/1.45 system-ui, sans-serif; color:#eef3ee; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #tabs { position:fixed; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:94vw; }
  button { font:inherit; border:0; border-radius:999px; padding:6px 13px; background:rgba(20,28,24,.72); color:#eef3ee; cursor:pointer; backdrop-filter:blur(6px); text-transform:capitalize; }
  button.on { background:var(--paper); color:var(--ink); font-weight:600; }
  #cap { position:fixed; left:14px; bottom:84px; max-width:min(420px,calc(100vw - 28px)); background:var(--paper); color:var(--ink); padding:12px 16px 10px; border-radius:4px; box-shadow:0 10px 30px rgba(0,0,0,.4); transform:rotate(-.8deg); }
  #cap h2 { margin:0; font:italic 700 20px/1.2 Georgia, serif; } #cap p { margin:5px 0 0; font-size:13.5px; } #cap .pl { color:#6a6556; font-size:12px; margin:2px 0 6px; }
  .tg span { display:inline-block; background:#e6dcc4; border-radius:999px; padding:1px 9px; margin:4px 4px 0 0; font-size:11.5px; }
  #bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; background:rgba(20,28,24,.7); padding:8px 14px; border-radius:999px; backdrop-filter:blur(6px); max-width:96vw; }
  #wx { display:flex; gap:4px; } #bar input[type=range] { width:150px; } #clock { min-width:96px; font-variant-numeric:tabular-nums; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:rgba(16,22,26,.7); font-size:18px; }
  #set { position:fixed; right:14px; bottom:84px; width:260px; background:rgba(20,28,24,.86); backdrop-filter:blur(8px); padding:12px 14px; border-radius:10px; display:grid; gap:8px; font-size:13px; } #set[hidden] { display:none; } #set label { display:flex; justify-content:space-between; align-items:center; gap:8px; } #set select { background:#f6efe0; color:#2b2a22; border:0; border-radius:6px; padding:3px 6px; } #set div { display:flex; gap:6px; flex-wrap:wrap; } #set small { color:#aab8ad; font-size:11.5px; }
  /* polish v1: clean view + walking */
  body.clean #tabs, body.clean #cap, body.clean #bar, body.clean #set { display:none !important; }
  #uibtn { position:fixed; top:10px; right:10px; z-index:5; width:40px; height:40px; padding:0; font-size:18px; display:grid; place-items:center; opacity:.55; }
  body.clean #uibtn { opacity:.3; }
  #stick { position:fixed; left:22px; bottom:34px; width:132px; height:132px; border-radius:50%; background:rgba(20,28,24,.28); border:2px solid rgba(255,255,255,.35); touch-action:none; display:none; z-index:4; }
  #stick i { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(255,255,255,.5); }
  body.walking #stick { display:block; }
  #walkbtn { position:fixed; right:10px; top:58px; z-index:5; opacity:.55; } body.clean #walkbtn { opacity:.3; } body.walking #walkbtn { opacity:.9; background:var(--paper); color:var(--ink); }
  #stormbtn { position:fixed; right:10px; top:106px; z-index:5; opacity:.55; } #windbtn { position:fixed; right:10px; top:154px; z-index:5; opacity:.55; } body.windy #windbtn { opacity:.95; background:#dff3dc; color:#16301a; } body.clean #windbtn { opacity:.3; } body.windy.clean #windbtn { opacity:.8; }
  #coldbtn { position:fixed; right:10px; top:250px; z-index:5; opacity:.55; } body.cold #coldbtn { opacity:.95; background:#e3f1ff; color:#102a44; } body.clean #coldbtn { opacity:.3; } body.cold.clean #coldbtn { opacity:.8; }
  #fogbtn { top:298px; } #rainbtn { top:346px; } #snowbtn { top:394px; } #fogbtn, #rainbtn, #snowbtn { position:fixed; right:10px; z-index:5; opacity:.55; } body.fogon #fogbtn, body.rainon #rainbtn, body.snowon #snowbtn { opacity:.95; background:#e6ecf2; color:#1a2430; } body.clean #fogbtn, body.clean #rainbtn, body.clean #snowbtn { opacity:.3; } body.clean.fogon #fogbtn, body.clean.rainon #rainbtn, body.clean.snowon #snowbtn { opacity:.8; }
  #litebtn { position:fixed; right:10px; top:442px; z-index:5; opacity:.55; } body.liteon #litebtn { opacity:.95; background:#fff1c9; color:#3a2a08; } body.clean #litebtn { opacity:.3; } body.liteon.clean #litebtn { opacity:.8; }
  #sheet { position:fixed; left:8px; right:64px; bottom:8px; max-height:44vh; overflow:auto; z-index:6; display:none; grid-template-columns:1fr 1fr; gap:6px 12px; padding:10px 12px; border-radius:16px; background:rgba(22,32,22,.74); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#fff; font:13px system-ui,sans-serif; } body.sheet #sheet { display:grid; }
  #sheet label { display:flex; flex-direction:column; gap:2px; } #sheet input[type=range] { width:100%; margin:0; } #sheet button { grid-column:1 / -1; }
  #slbtn { position:fixed; right:10px; top:490px; z-index:7; opacity:.75; } body.sheet #slbtn { opacity:1; background:#dfe9ff; color:#10203a; }
  #sndbtn { position:fixed; right:10px; top:202px; z-index:5; opacity:.55; display:none; } body.stormy #sndbtn, body.windy #sndbtn { display:block; } body.stormy #stormbtn { opacity:.95; background:#d8e4ff; color:#14202e; } body.clean #stormbtn { opacity:.3; } body.stormy.clean #stormbtn { opacity:.8; }
  #flash { position:fixed; inset:0; background:#eef2ff; opacity:0; pointer-events:none; z-index:3; mix-blend-mode:screen; } #stormlab { display:none; } body.stormy #stormlab { display:inline; }
  @media (max-width:640px) { #cap { bottom:128px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tabs"></div>
<div id="cap"></div>
<div id="bar">
  <span id="clock"></span><input id="time" type="range" min="0" max="1" step="0.005" value="0.5" aria-label="Time of day">
  <span id="wx"><button data-w="default">Its own</button><button data-w="clear">Clear</button><button data-w="cloudy">Cloudy</button><button data-w="fog">Fog</button><button data-w="rain">Rain</button><button data-w="snow">Snow</button><button data-w="storm">Storm</button></span>
  <label id="stormlab">⚡ <input id="storm" type="range" min="0.2" max="1" step="0.05" value="0.7" aria-label="Storm intensity"></label> <label><input id="spin" type="checkbox" checked> turn</label><button id="save">Save postcard</button>
</div>
<div id="sheet"><label>🍃 wind <input id="wind" type="range" min="0" max="1" step="0.05" value="0.3" aria-label="Wind"></label> <label>🌤 rays <input id="rays" type="range" min="0" max="1" step="0.05" value="0.2" aria-label="God rays"></label> <label>✨ particles <input id="dustw" type="range" min="0" max="1" step="0.05" value="0.25" aria-label="Particles"></label> <label>🌅 warm <input id="warmw" type="range" min="-1" max="1" step="0.05" value="0" aria-label="Warm or cool light"></label> <label>☀ sun <input id="sunpw" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Sun strength"></label> <button id="litereset">reset light</button> <label>🌫 fog <input id="fogw" type="range" min="0" max="1" step="0.05" value="0" aria-label="Fog"></label> <label>🌧 rain <input id="rainw" type="range" min="0" max="1" step="0.05" value="0" aria-label="Rain"></label> <label>🌨 snow <input id="snoww" type="range" min="0" max="1" step="0.05" value="0" aria-label="Snow"></label> <label>❄ cold <input id="cold" type="range" min="0" max="1" step="0.05" value="0" aria-label="Cold"></label></div><button id="slbtn" aria-label="Sliders for wind, light, fog, rain, snow and cold">🎚</button><button id="uibtn" aria-label="Show or hide the menus">☰</button><button id="walkbtn">Walk</button><button id="stormbtn" aria-label="Thunderstorm, tap to raise the intensity">⚡</button><button id="windbtn" aria-label="Wind, tap to raise it">🍃 <span id="windarrow" style="display:inline-block">➤</span></button><button id="coldbtn" aria-label="Cold, tap to raise it">❄</button><button id="fogbtn" aria-label="Fog, tap to raise it">🌫</button><button id="rainbtn" aria-label="Rain, tap to raise it">🌧</button><button id="snowbtn" aria-label="Snow, tap to raise it">🌨</button><button id="litebtn" aria-label="Light and particles presets, tap to cycle">✨</button><button id="sndbtn" aria-label="Storm sound">🔊</button><div id="flash"></div><div id="stick"><i></i></div>
<div id="loading">Loading the postcard…</div>
<script type="module" src="./diorama.js"></script>
</body>
</html>
